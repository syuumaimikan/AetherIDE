<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>
    <linearGradient id="aetherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#232738" stroke-width="4" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#252b40" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2e3650" stroke-width="1.5" />

  <!-- Futuristic Aether Core Glyph (A & Hexagon & Prism) -->
  <polygon points="256,96 384,170 384,318 256,392 128,318 128,170" fill="none" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)" />
  <polygon points="256,116 364,180 364,308 256,372 148,308 148,180" fill="none" stroke="url(#aetherGrad)" stroke-width="10" />

  <!-- Inner Triangles forming 'A' -->
  <polygon points="256,150 330,290 182,290" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
  <line x1="210" y1="250" x2="302" y2="250" stroke="url(#aetherGrad)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Central Quantum Energy Core -->
  <circle cx="256" cy="230" r="18" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="230" r="8" fill="#ffffff" />

  <!-- Satellite Nodes representing Multi-Agents -->
  <circle cx="256" cy="96" r="10" fill="#06b6d4" />
  <circle cx="384" cy="170" r="10" fill="#6366f1" />
  <circle cx="384" cy="318" r="10" fill="#a855f7" />
  <circle cx="256" cy="392" r="10" fill="#ec4899" />
  <circle cx="128" cy="318" r="10" fill="#3b82f6" />
  <circle cx="128" cy="170" r="10" fill="#10b981" />
</svg>
