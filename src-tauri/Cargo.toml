[package]
name = "aether-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "aether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Workspace crates
aether-core = { workspace = true }
aether-permission = { workspace = true }
aether-tool-runtime = { workspace = true }
aether-workspace = { workspace = true }
aether-terminal = { workspace = true }
aether-git = { workspace = true }
aether-search = { workspace = true }
aether-ai-core = { workspace = true }
aether-context-engine = { workspace = true }
aether-agent-runtime = { workspace = true }
aether-agent-orchestrator = { workspace = true }
